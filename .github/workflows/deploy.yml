name: Deploy

# Ships main to the server after CI passes on it. Does nothing until the DEPLOY_* secrets
# exist (see deploy/README.md), so it's safe to have in the repo before the server is set up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to hustle.mkultra.monster
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hustle.mkultra.monster
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::notice::Deploy secrets aren't set up yet, so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys entry only lets this key run deploy.sh, which
          # receives the commit sha as its one argument.
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "mafia-hustle@$HOST" "$SHA"

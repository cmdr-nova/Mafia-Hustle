[project]
name = "mafia-hustle"
version = "0.3.0"
description = "A small browser game in the spirit of Mafia Wars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1",
    "flask-limiter>=3.8",
    "flask-wtf>=1.2",
    "dnspython>=2.6",
    "joserfc>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.32.2",
    "requests-hardened>=1.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=23"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "responses>=0.25",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mafia_hustle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["mafia_hustle"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security (bandit), SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works, tests use throwaway secrets, and seeded dice are the point
"tests/**" = ["S101", "S105", "S106", "S311"]
# The job list is a table, and it reads better with one job per line
"mafia_hustle/catalog.py" = ["E501"]
